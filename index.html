<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>BokListeApp</title>
  </head>
  <body>
    <main>
      <h1>Bok Liste App</h1>
      <section>
        <form class="book-form" action="submit" id="bookForm">
          <!-- Boknavn -->
          <label for="bookName"
            >Bok Navn:
            <input type="text" name="bookName" id="bookName" />
          </label>
          <!--Forfatter  -->
          <label for="author"
            >Forfatter:
            <input type="text" name="author" id="author" />
          </label>
          <!--Sjanger -->
          <label for="genre"
            >Sjanger:
            <select name="genre" id="genre">
              <option value="Fiction">Fiction</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Science Fiction">Science Fiction</option>
              <option value="Mystery">Mystery</option>
              <option value="Romance">Romance</option>
              <option value="Thriller">Thriller</option>
              <option value="Biography/Memoir">Biography/Memoir</option>
              <option value="Historical">Historical</option>
              <option value="Other">Other</option>
            </select>
            <!-- <input type="text" name="genre" id="genre" /> -->
          </label>
          <!-- Antall sider -->
          <label for="pages"
            >Antall sider:
            <input type="number" name="pages" id="pages" />
          </label>
          <!--Rating  -->
          <label for="rating"
            >Rating:
            <select name="rating" id="rating">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
            <!-- <input type="number" name="rating" id="rating" /> -->
          </label>

          <!-- submit knapp -->
          <button class="submit-btn" type="submit">Submit</button>
        </form>
      </section>
      <!-- Søke og slettefunksjon kommer senere -->
      <section>
        <search>
          <input
            type="search"
            name="q"
            id="search"
            placeholder="Søk etter bok..."
            aria-label="Search site content"
          />

          <button type="input" class="search_btn" id="searchBtn" name="search">
            Søk
          </button>
        </search>

        <!-- Sortering -->
        <label for="sortSelect">
          Sorter etter:
          <select name="sort" id="sortSelect">
            <option value="NA">Ingen sortering</option>
            <option value="titleAsc">Tittel (A-Å)</option>
            <option value="titleDesc">Tittel (Å-A)</option>
            <option value="ratingAsc">Rating (lav-høy)</option>
            <option value="ratingDesc">Rating (høy-lav)</option>
          </select>
        </label>

        <button id="delete_All_Btn" class="delete_All_Btn" type="button">
          SLETT ALLE BØKER!
        </button>

        <div class="book_container" id="bookContainer"></div>
      </section>
    </main>
  </body>
</html>
